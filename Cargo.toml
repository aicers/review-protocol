[package]
name = "review-protocol"
version = "0.37.0"
edition = "2024"
publish = false

# Publish rustdoc for both optional communication roles.
[package.metadata.docs.rs]
features = ["client", "server"]

[features]
client = [
  "async-trait",
  "bincode",
  "oinq",
  "quinn",
  "rustls",
  "rustls-pemfile",
  "semver",
  "thiserror",
  "tokio",
  "tokio/macros",
  "tokio/io-util",
  "tokio/time",
]
server = [
  "async-trait",
  "anyhow",
  "bincode",
  "oinq",
  "quinn",
  "rustls",
  "semver",
  "thiserror",
  "tokio",
  # Session acceptance selects both stream directions; framing uses I/O and deadlines.
  "tokio/macros",
  "tokio/io-util",
  "tokio/time",
]
tokio = ["dep:tokio"]
test-support = ["client", "server", "rcgen", "tokio/rt-multi-thread"]
rcgen = ["dep:rcgen"]

[dependencies]
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "1", features = ["serde"] }
num_enum = { version = "0.7" }
oinq = { git = "https://github.com/petabi/oinq.git", tag = "0.14.2", optional = true }
quinn = { version = "0.11", default-features = false, features = [
  "log",
  "platform-verifier",
  "runtime-tokio",
  "rustls-aws-lc-rs",
  "bloom",
], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }
rustls-pemfile = { version = "2", optional = true }
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1.19"
structured = "0.18.0"
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
# Checks `types::RawEventKind`, and the fields of the host header, Sysmon, log
# and network `Http` copies in `types::raw_event`, against the tag those copies
# follow. giganto-client is `publish = false`, so it is a git dependency.
giganto-client = { git = "https://github.com/aicers/giganto-client.git", tag = "0.32.0" }
quinn = { version = "0.11", default-features = false, features = [
  "log",
  "platform-verifier",
  "runtime-tokio",
  "rustls-aws-lc-rs",
  "bloom",
] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Deliberately compiles a second rustls provider (ring) into test builds, so
# `build_endpoint` is tested the way applications such as roxyd and piglet
# build it. Do not remove it.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
serde_json = "1"
serde_bytes = "0.11"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-test = "0.4.4"

[[example]]
name = "session_server"
required-features = ["client", "server"]

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
