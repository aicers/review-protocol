[package]
name = "review-protocol-surface-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
client = ["review-protocol/client"]
server = ["review-protocol/server"]
test-support = ["client", "server", "review-protocol/test-support"]
legacy = ["client", "server", "dep:quinn", "dep:anyhow"]

[dependencies]
review-protocol = { path = "../..", default-features = false }
quinn = { version = "0.11", optional = true, default-features = false }
anyhow = { version = "1", optional = true }
